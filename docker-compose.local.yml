services:
  postgres:
    image: ${CHATBI_BOUND_DATABASE_IMAGE:-${CHATBI_DATABASE_IMAGE:?run ./local build first}}
    restart: "no"
    labels: &stable-labels
      com.chatbi.environment: stable
      com.chatbi.product: chatbi-engine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chatbi_mvp}
      POSTGRES_USER: ${POSTGRES_MIGRATOR_USER:-chatbi_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?run ./local init-config}
      POSTGRES_APP_USER: chatbi_app
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?run ./local init-config}
      POSTGRES_CONTROL_DB: chatbi_control
      POSTGRES_CONTROL_APP_USER: chatbi_control_user
      POSTGRES_CONTROL_APP_PASSWORD: ${POSTGRES_CONTROL_APP_PASSWORD:?run ./local init-config}
      POSTGRES_CONTROL_MIGRATOR_USER: ${POSTGRES_MIGRATOR_USER:-chatbi_migrator}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "sh /workspace/database/init/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:v1.18.3@sha256:ecc81d662bb9bb734db879b94461eb44be38604fc259491d478ad7e673238a0d
    restart: "no"
    labels: *stable-labels
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?run ./local init-config}
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    image: ${CHATBI_API_IMAGE:?run ./local build first}
    restart: "no"
    init: true
    security_opt:
      - seccomp=${CHATBI_LOCAL_SECCOMP_PROFILE:?local entry must set the Chromium seccomp profile}
    labels: *stable-labels
    environment: &runtime-environment
      CHATBI_ENV: development
      CHATBI_RUNTIME_ENV: stable
      CHATBI_LOCAL_OPERATIONS_ENABLED: "true"
      CHATBI_OPERATIONS_SOCKET_PATH: /opt/chatbi-runtime/status.sock
      CHATBI_SOURCE_COMMIT: ${CHATBI_SOURCE_COMMIT:?run ./local build first}
      CHATBI_SERVICE_VERSION: ${CHATBI_SOURCE_COMMIT:-unknown}
      CHATBI_LOCAL_HTTP_PORT: ${CHATBI_LOCAL_HTTP_PORT:-8080}
      CHATBI_ADMIN_SECRET_KEY: ${CHATBI_ADMIN_SECRET_KEY:?run ./local init-config}
      CHATBI_WEB_ORIGIN: http://127.0.0.1:${CHATBI_LOCAL_HTTP_PORT:-8080}
      CHATBI_WEB_DIST_DIR: /opt/chatbi-web
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-flash}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.1}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-chatbi_mvp}
      POSTGRES_APP_USER: chatbi_app
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?run ./local init-config}
      POSTGRES_CONTROL_DB: chatbi_control
      POSTGRES_CONTROL_APP_USER: chatbi_control_user
      POSTGRES_CONTROL_APP_PASSWORD: ${POSTGRES_CONTROL_APP_PASSWORD:?run ./local init-config}
      RAG_ONLINE_RETRIEVAL_ENABLED: "true"
      RAG_MODEL_DIR: /opt/chatbi-model/bge-m3-5617a9f61b02
      RAG_OUTPUT_DIR: /opt/chatbi-rag
      RAG_QDRANT_URL: http://qdrant:6333
      RAG_QDRANT_API_KEY: ${QDRANT_API_KEY:?run ./local init-config}
      RAG_COLLECTION_PREFIX: chatbi
      RAG_EMBEDDING_DEVICE: cpu
      RAG_EMBEDDING_USE_FP16: "false"
      RAG_EMBEDDING_DIMENSION: "1024"
      RAG_EMBEDDING_BATCH_SIZE: "8"
      CHATBI_OBSERVABILITY_ENABLED: ${CHATBI_OBSERVABILITY_ENABLED:-false}
      CHATBI_TRACE_CONTENT_ENABLED: "false"
      CHATBI_OTLP_TIMEOUT_SECONDS: ${CHATBI_OTLP_TIMEOUT_SECONDS:-5}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-chatbi-engine-stable}
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=stable
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    ports:
      - target: 8000
        published: "${CHATBI_LOCAL_HTTP_PORT:-8080}"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - type: bind
        source: ${CHATBI_LOCAL_MODEL_DIR:-.model-cache/bge-m3-5617a9f61b02}
        target: /opt/chatbi-model/bge-m3-5617a9f61b02
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CHATBI_BOUND_RAG_DIR:-.local/rag}
        target: /opt/chatbi-rag
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: .local/operations/public
        target: /opt/chatbi-operations
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CHATBI_BOUND_OPERATIONS_API_DIR:-.local/operations/api}
        target: /opt/chatbi-runtime
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s
    stop_grace_period: 30s

  migrator:
    image: ${CHATBI_API_IMAGE:?run ./local build first}
    profiles: [tools]
    restart: "no"
    labels: *stable-labels
    entrypoint: ["python", "-m", "src.bootstrap"]
    command: ["migrate"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-chatbi_mvp}
      POSTGRES_APP_USER: chatbi_app
      POSTGRES_CONTROL_DB: chatbi_control
      POSTGRES_CONTROL_APP_USER: chatbi_control_user
      POSTGRES_CONTROL_APP_PASSWORD: ${POSTGRES_CONTROL_APP_PASSWORD:?run ./local init-config}
      POSTGRES_MIGRATOR_USER: ${POSTGRES_MIGRATOR_USER:-chatbi_migrator}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?run ./local init-config}
      POSTGRES_CONTROL_MIGRATOR_USER: ${POSTGRES_MIGRATOR_USER:-chatbi_migrator}
      POSTGRES_CONTROL_BOOTSTRAP_DB: postgres

  admin:
    image: ${CHATBI_API_IMAGE:?run ./local build first}
    profiles: [tools]
    restart: "no"
    labels: *stable-labels
    entrypoint: ["python", "-m", "src.bootstrap"]
    command: ["create-admin"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-chatbi_mvp}
      POSTGRES_APP_USER: chatbi_app
      POSTGRES_CONTROL_DB: chatbi_control
      POSTGRES_CONTROL_APP_USER: chatbi_control_user
      POSTGRES_CONTROL_APP_PASSWORD: ${POSTGRES_CONTROL_APP_PASSWORD:?run ./local init-config}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?run ./local init-config}

  model:
    image: ${CHATBI_API_IMAGE:?run ./local build first}
    profiles: [tools]
    restart: "no"
    labels: *stable-labels
    user: "${CHATBI_LOCAL_UID:-1000}:${CHATBI_LOCAL_GID:-1000}"
    entrypoint: ["python", "-m", "src.bootstrap"]
    command: ["prepare-model"]
    environment: &model-environment
      RAG_MODEL_DIR: /opt/chatbi-model/bge-m3-5617a9f61b02
      RAG_OUTPUT_DIR: /opt/chatbi-rag
      RAG_QDRANT_URL: http://qdrant:6333
      RAG_QDRANT_API_KEY: ${QDRANT_API_KEY:?run ./local init-config}
      QDRANT_API_KEY: ${QDRANT_API_KEY:?run ./local init-config}
      RAG_COLLECTION_PREFIX: chatbi
      RAG_EMBEDDING_DEVICE: cpu
      RAG_EMBEDDING_USE_FP16: "false"
      RAG_EMBEDDING_DIMENSION: "1024"
      RAG_EMBEDDING_BATCH_SIZE: "8"
    volumes:
      - type: bind
        source: ${CHATBI_LOCAL_MODEL_DIR:-.model-cache/bge-m3-5617a9f61b02}
        target: /opt/chatbi-model/bge-m3-5617a9f61b02
        bind:
          create_host_path: false
      - type: bind
        source: ${CHATBI_BOUND_RAG_DIR:-.local/rag}
        target: /opt/chatbi-rag
        bind:
          create_host_path: false

  qdrant-check:
    image: ${CHATBI_API_IMAGE:?run ./local build first}
    profiles: [tools]
    restart: "no"
    labels: *stable-labels
    entrypoint: ["python", "-m", "scripts.local_release"]
    command: ["wait-qdrant"]
    environment:
      RAG_QDRANT_URL: http://qdrant:6333

  verify:
    image: ${CHATBI_API_IMAGE:?run ./local build first}
    profiles: [tools]
    restart: "no"
    labels: *stable-labels
    user: "${CHATBI_LOCAL_UID:-1000}:${CHATBI_LOCAL_GID:-1000}"
    entrypoint: ["python", "-m", "scripts.local_release"]
    command: ["verify-runtime"]
    environment: *runtime-environment
    volumes:
      - type: bind
        source: ${CHATBI_BOUND_STATE_DIR:-.local}
        target: /opt/chatbi-state
      - type: bind
        source: ${CHATBI_LOCAL_MODEL_DIR:-.model-cache/bge-m3-5617a9f61b02}
        target: /opt/chatbi-model/bge-m3-5617a9f61b02
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CHATBI_BOUND_RAG_DIR:-.local/rag}
        target: /opt/chatbi-rag
        read_only: true
        bind:
          create_host_path: false


  operations:
    image: ${CHATBI_OPERATIONS_IMAGE:-chatbi-local-operations:uninitialized}
    profiles: [tools]
    restart: "no"
    init: true
    labels: *stable-labels
    user: "${CHATBI_LOCAL_UID:-1000}:${CHATBI_LOCAL_GID:-1000}"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-chatbi_mvp}
      POSTGRES_CONTROL_DB: chatbi_control
      POSTGRES_MIGRATOR_USER: ${POSTGRES_MIGRATOR_USER:-chatbi_migrator}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?run ./local init-config}
      CHATBI_OPERATIONS_SOCKET_PATH: /state/operations/${CHATBI_BOUND_OPERATIONS_API_RELATIVE:-api}/status.sock
    volumes:
      - type: bind
        source: .local/operations
        target: /state/operations
        bind:
          create_host_path: false
      - type: bind
        source: .local/backups
        target: /state/backups
        bind:
          create_host_path: false
      - type: bind
        source: .local/backup-keys
        target: /state/backup-keys
        bind:
          create_host_path: false
      - type: bind
        source: .local/operation.lock
        target: /state/operation.lock
        bind:
          create_host_path: false

  restore-tool:
    extends:
      service: operations
    profiles: [tools]
    entrypoint: ["python3", "-m", "scripts.local_restore"]
    command: ["--help"]

  backup:
    extends:
      service: operations
    profiles: []
    entrypoint: ["python3", "-m", "scripts.local_backup_schedule"]
    command: []
    stop_grace_period: 30s

volumes:
  postgres_data:
    name: ${CHATBI_BOUND_POSTGRES_VOLUME:-chatbi_stable_postgres_data}
    external: true
  qdrant_data:
    name: ${CHATBI_BOUND_QDRANT_VOLUME:-chatbi_stable_qdrant_data}
    external: true
