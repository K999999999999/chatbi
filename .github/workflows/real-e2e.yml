name: Real E2E

on:
  workflow_dispatch:

concurrency:
  group: real-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  real-e2e:
    name: Real E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chatbi_mvp
          POSTGRES_USER: chatbi_migrator
          POSTGRES_PASSWORD: ci-migrator-password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U chatbi_migrator -d chatbi_mvp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      qdrant:
        image: qdrant/qdrant:v1.18.3
        env:
          QDRANT__SERVICE__API_KEY: ci-qdrant-api-key
        ports:
          - 6333:6333
          - 6334:6334

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5433"
      POSTGRES_DB: chatbi_mvp
      POSTGRES_APP_USER: chatbi_app
      POSTGRES_APP_PASSWORD: ci-app-password
      QDRANT_API_KEY: ci-qdrant-api-key
      RAG_QDRANT_URL: http://127.0.0.1:6333
      RAG_QDRANT_API_KEY: ci-qdrant-api-key
      RAG_OUTPUT_DIR: data/rag
      RAG_MODEL_NAME_OR_PATH: BAAI/bge-m3
      RAG_EMBEDDING_DIMENSION: "1024"
      RAG_EMBEDDING_BATCH_SIZE: "4"
      RAG_EMBEDDING_USE_FP16: "false"
      RAG_EMBEDDING_DEVICE: cpu
      RAG_QDRANT_TIMEOUT_SECONDS: "30"
      RAG_COLLECTION_PREFIX: chatbi
      RAG_ONLINE_RETRIEVAL_ENABLED: "true"
      POSTGRES_MIGRATOR_USER: chatbi_migrator
      POSTGRES_MIGRATOR_PASSWORD: ci-migrator-password
      POSTGRES_CONTROL_DB: chatbi_control
      POSTGRES_CONTROL_APP_USER: chatbi_control_user
      POSTGRES_CONTROL_APP_PASSWORD: ci-control-password
      POSTGRES_CONTROL_MIGRATOR_USER: chatbi_migrator
      POSTGRES_CONTROL_BOOTSTRAP_DB: postgres
      CHATBI_RUNTIME_ENV: ci
      CHATBI_TRACE_CONTENT_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.2"

      - name: Install Python
        run: uv python install 3.11

      - name: Verify lockfile
        run: uv lock --check

      - name: Prepare real E2E runtime dependencies
        run: uv run --python 3.11 --locked python -c "print('runtime dependencies ready')"

      - name: Validate required LLM configuration
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          set -euo pipefail

          for variable in LLM_API_KEY LLM_BASE_URL LLM_MODEL; do
            if [ -z "${!variable}" ]; then
              echo "::error::Required GitHub Secret ${variable} is not configured."
              exit 1
            fi
          done

      - name: Wait for Qdrant
        shell: bash
        run: |
          set -euo pipefail

          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error \
              --header "api-key: ${QDRANT_API_KEY}" \
              http://127.0.0.1:6333/healthz > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          echo '::error::Qdrant did not become ready within 120 seconds.'
          exit 1

      - name: Bootstrap full isolated Sales Mart seed
        env:
          PGPASSWORD: ci-migrator-password
        run: >-
          docker run --rm --network host
          -e PGPASSWORD
          -v "${GITHUB_WORKSPACE}/database:/database:ro"
          postgres:16-alpine
          psql --set ON_ERROR_STOP=1
          --host 127.0.0.1 --port 5433
          --username chatbi_migrator --dbname chatbi_mvp
          --set business_db=chatbi_mvp
          --set app_user=chatbi_app --set app_password=ci-app-password
          --set control_app_user=chatbi_control_user
          --set control_app_password=ci-control-password
          --file /database/init/00_create_runtime_roles.sql
          --file /database/sales_mart/001_create_schema.sql
          --file /database/dev/seed_sales_mart.sql
          --file /database/grants.sql

      - name: Initialize Control DB and checkpoints
        run: uv run --python 3.11 --locked --no-sync python -m src.bootstrap migrate

      - name: Build real BGE-M3 and Qdrant assets
        shell: bash
        run: |
          set -euo pipefail

          build_id="ci-${GITHUB_SHA:0:12}"
          uv run --python 3.11 --locked --no-sync \
            python -m src.bootstrap build-rag --build-id "$build_id"

      - name: Run all three formal suites and verify baseline identity
        id: baseline
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_TEMPERATURE: "0.1"
          LLM_MAX_TOKENS: "1200"
          LLM_TIMEOUT_SECONDS: "30"
        shell: bash
        run: |
          set -uo pipefail

          report_dir="${RUNNER_TEMP}/chatbi-real-evaluation/formal"
          status=0
          for suite in single-turn multi-turn business-analysis; do
            uv run --python 3.11 --locked --no-sync \
              python -m evaluation --"$suite" --online-retrieval \
              --output-dir "$report_dir" || status=1
          done
          uv run --python 3.11 --locked --no-sync \
            python -m evaluation.common.real_e2e_acceptance \
            --report-dir "$report_dir" --expected-commit "$GITHUB_SHA" \
            --expected-rag-version "ci-${GITHUB_SHA:0:12}" || status=1
          exit "$status"

      - name: Record three independent multi-turn diagnostics
        id: diagnostics
        if: ${{ !cancelled() && (steps.baseline.outcome == 'success' || steps.baseline.outcome == 'failure') }}
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_TEMPERATURE: "0.1"
          LLM_MAX_TOKENS: "1200"
          LLM_TIMEOUT_SECONDS: "30"
        shell: bash
        run: |
          set -uo pipefail

          for attempt in 1 2 3; do
            report_dir="${RUNNER_TEMP}/chatbi-real-evaluation/diagnostic-$attempt"
            if uv run --python 3.11 --locked --no-sync \
              python -m evaluation --multi-turn --online-retrieval \
              --output-dir "$report_dir"; then
              echo "Diagnostic $attempt: PASS" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Diagnostic $attempt: FAIL or unavailable; inspect retained report" >> "$GITHUB_STEP_SUMMARY"
              echo '::warning::Multi-turn stability diagnostic failed; formal baseline result remains unchanged.'
            fi
          done

      - name: Upload Real E2E reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-e2e-reports-${{ github.run_id }}
          path: ${{ runner.temp }}/chatbi-real-evaluation
          if-no-files-found: warn
          retention-days: 14
