name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deterministic-tests:
    name: Deterministic tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Web frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.2"

      - name: Install Python
        run: uv python install 3.11

      - name: Verify lockfile
        run: uv lock --check

      - name: Compile Python sources
        run: uv run --python 3.11 --locked python -m compileall -q src evaluation tests

      - name: Check documentation and module boundaries
        run: |
          uv run --python 3.11 --locked python -m scripts.check_documentation
          uv run --python 3.11 --locked python -m scripts.check_module_boundaries

      - name: Collect pytest tests
        run: uv run --python 3.11 --locked --with pytest python -m pytest --collect-only -q

      - name: Run desktop Chrome browser tests
        working-directory: frontend
        run: |
          npx playwright install --with-deps chrome
          npm test
          npm run test:dev

      - name: Run deterministic tests
        run: uv run --python 3.11 --locked --with pytest python -m pytest -q

  code-quality:
    name: Code quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.2"

      - name: Install Python
        run: uv python install 3.11

      - name: Verify lockfile
        run: uv lock --check

      - name: Check Python quality
        run: bash scripts/check_python_quality.sh

  sql-guard-tests:
    name: SQL Guard tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.2"

      - name: Install Python
        run: uv python install 3.11

      - name: Verify lockfile
        run: uv lock --check

      - name: Run SQL Guard tests
        run: >-
          uv run --python 3.11 --locked --with pytest python -m pytest -q
          tests/online_query/test_sql_guard.py

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5433"
      POSTGRES_DB: chatbi_mvp
      POSTGRES_USER: chatbi_migrator
      POSTGRES_APP_USER: chatbi_app
      POSTGRES_APP_PASSWORD: ci-app-password
      POSTGRES_CONTROL_DB: chatbi_control
      POSTGRES_CONTROL_APP_USER: chatbi_control_user
      POSTGRES_CONTROL_APP_PASSWORD: ci-control-password
      POSTGRES_MIGRATOR_USER: chatbi_migrator
      POSTGRES_MIGRATOR_PASSWORD: ci-migrator-password
      POSTGRES_CONTROL_MIGRATOR_USER: chatbi_migrator
      POSTGRES_CONTROL_BOOTSTRAP_DB: postgres
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chatbi_mvp
          POSTGRES_USER: chatbi_migrator
          POSTGRES_PASSWORD: ci-migrator-password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U chatbi_migrator -d chatbi_mvp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.2"

      - name: Install Python
        run: uv python install 3.11

      - name: Verify lockfile
        run: uv lock --check

      - name: Prepare CI evidence directory
        run: mkdir -p reports/ci

      - name: Record PostgreSQL test environment identity
        shell: bash
        run: |
          set -euo pipefail
          python_path="$(uv python find 3.11)"
          postgres_image_id="$(docker image inspect postgres:16-alpine --format '{{.Id}}')"
          {
            printf 'python_version=%s\n' "$("$python_path" --version 2>&1)"
            printf 'uv_version=%s\n' "$(uv --version)"
            printf 'postgres_image_id=%s\n' "$postgres_image_id"
            printf 'uv_lock_sha256=%s\n' "$(sha256sum uv.lock | cut -d ' ' -f 1)"
            printf 'package_lock_sha256=%s\n' "$(sha256sum frontend/package-lock.json | cut -d ' ' -f 1)"
          } > reports/ci/environment.txt

      - name: Bootstrap CI database
        env:
          PGPASSWORD: ci-migrator-password
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e PGPASSWORD \
            -v "${GITHUB_WORKSPACE}/database:/database:ro" \
            postgres:16-alpine \
            psql --set ON_ERROR_STOP=1 \
              --host 127.0.0.1 --port 5433 \
              --username chatbi_migrator --dbname chatbi_mvp \
              --file /database/ci/bootstrap.sql

      - name: Run PostgreSQL CI profile
        env:
          RUN_DATABASE_TESTS: "1"
        shell: bash
        run: |
          set -euo pipefail
          uv run --python 3.11 --locked --with pytest python -m pytest -q \
            tests/online_query/test_database_integration.py \
            tests/online_query/test_service_integration.py::ServiceDatabaseIntegrationTest \
            --junitxml=reports/ci/postgres-ci.xml

      - name: Initialize development PostgreSQL fixture
        env:
          PGPASSWORD: ci-migrator-password
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e PGHOST=127.0.0.1 -e PGPORT=5433 -e PGPASSWORD \
            -e POSTGRES_USER -e POSTGRES_DB \
            -e POSTGRES_APP_USER -e POSTGRES_APP_PASSWORD \
            -e POSTGRES_CONTROL_DB -e POSTGRES_CONTROL_APP_USER \
            -e POSTGRES_CONTROL_APP_PASSWORD -e POSTGRES_CONTROL_MIGRATOR_USER \
            -v "${GITHUB_WORKSPACE}/database:/workspace/database:ro" \
            postgres:16-alpine sh -eu -c '
              psql --set ON_ERROR_STOP=1 --username "$POSTGRES_USER" \
                --dbname postgres \
                --command "DROP DATABASE IF EXISTS chatbi_mvp WITH (FORCE)"
              psql --set ON_ERROR_STOP=1 --username "$POSTGRES_USER" \
                --dbname postgres --command "DROP ROLE IF EXISTS chatbi_app"
              psql --set ON_ERROR_STOP=1 --username "$POSTGRES_USER" \
                --dbname postgres --command "DROP ROLE IF EXISTS chatbi_control_user"
              createdb --username "$POSTGRES_USER" --owner "$POSTGRES_USER" "$POSTGRES_DB"
              sh /workspace/database/init/10_chatbi_dev_environment.sh
            '

      - name: Run PostgreSQL development profile
        env:
          RUN_DATABASE_TESTS: "1"
          RUN_DEVELOPMENT_DATABASE_TESTS: "1"
        shell: bash
        run: |
          set -euo pipefail
          uv run --python 3.11 --locked --with pytest python -m src.bootstrap migrate
          uv run --python 3.11 --locked --with pytest python -m pytest -q \
            tests/online_query/test_database_integration.py \
            tests/online_query/test_service_integration.py::ServiceDatabaseIntegrationTest \
            tests/chatbi_control/test_postgres_dev_environment.py \
            tests/chatbi_control/test_admin_recovery_postgres.py \
            tests/chatbi_control/test_execution_postgres.py \
            tests/chatbi_control/test_history_postgres.py \
            tests/evaluation/common/test_database_fingerprint.py \
            --junitxml=reports/ci/postgres-development.xml

      - name: Build PDF renderer test image
        shell: bash
        run: |
          set -euo pipefail
          docker build --file docker/python-dev.Dockerfile --tag chatbi-python-dev:ci .
          printf 'python_dev_image_id=%s\n' \
            "$(docker image inspect chatbi-python-dev:ci --format '{{.Id}}')" \
            >> reports/ci/environment.txt

      - name: Run real PDF renderer tests
        env:
          CHATBI_DEV_PYTHON_IMAGE: chatbi-python-dev:ci
        shell: bash
        run: |
          set -euo pipefail
          ./dev test renderer

      - name: Upload PostgreSQL and renderer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: postgres-renderer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/ci/*.xml
            reports/ci/*.txt
            reports/tests/*.json
            reports/tests/*/*.xml
          if-no-files-found: ignore
          retention-days: 14

  application-smoke:
    name: Application startup smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chatbi_mvp
          POSTGRES_USER: chatbi_migrator
          POSTGRES_PASSWORD: ci-migrator-password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U chatbi_migrator -d chatbi_mvp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build default Web entry
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.2"

      - name: Install Python
        run: uv python install 3.11

      - name: Verify lockfile
        run: uv lock --check

      - name: Prepare runtime environment
        run: uv run --python 3.11 --locked python -c "print('runtime dependencies ready')"

      - name: Start API and packaged Web smoke service
        shell: bash
        run: |
          set -euo pipefail

          ci_admin_password="$(openssl rand -hex 32)"
          ci_admin_secret_key="$(openssl rand -hex 32)"
          echo "::add-mask::$ci_admin_password"
          echo "::add-mask::$ci_admin_secret_key"

          cat > .env.ci <<'EOF'
          LLM_API_KEY=ci-test-key
          LLM_BASE_URL=http://127.0.0.1:1/v1
          LLM_MODEL=ci-test-model
          LLM_TEMPERATURE=0.1
          LLM_MAX_TOKENS=1200
          LLM_TIMEOUT_SECONDS=1
          POSTGRES_HOST=127.0.0.1
          POSTGRES_PORT=5433
          POSTGRES_DB=chatbi_mvp
          POSTGRES_MIGRATOR_USER=chatbi_migrator
          POSTGRES_MIGRATOR_PASSWORD=ci-migrator-password
          POSTGRES_APP_USER=chatbi_app
          POSTGRES_APP_PASSWORD=ci-app-password
          POSTGRES_CONTROL_DB=chatbi_control
          POSTGRES_CONTROL_APP_USER=chatbi_control_user
          POSTGRES_CONTROL_APP_PASSWORD=ci-control-password
          POSTGRES_CONTROL_MIGRATOR_USER=chatbi_migrator
          POSTGRES_CONTROL_BOOTSTRAP_DB=postgres
          RAG_ONLINE_RETRIEVAL_ENABLED=false
          CHATBI_ENV=development
          CHATBI_WEB_ORIGIN=http://127.0.0.1:8000
          CHATBI_WEB_DIST_DIR=frontend/dist
          CHATBI_RUNTIME_ENV=ci
          CHATBI_TRACE_CONTENT_ENABLED=false
          EOF
          printf 'CHATBI_ADMIN_SECRET_KEY=%s\n' "$ci_admin_secret_key" >> .env.ci

          uv run --python 3.11 --locked --no-sync --env-file .env.ci \
            python -m src.bootstrap migrate

          printf '%s\n%s\n' "$ci_admin_password" "$ci_admin_password" |
            uv run --python 3.11 --locked --no-sync --env-file .env.ci \
              python -m src.bootstrap create-admin --username admin-1

          uv run --python 3.11 --locked --no-sync --env-file .env.ci \
            uvicorn src.query_api.main:app --host 127.0.0.1 --port 8000 \
            > api.log 2>&1 &
          api_pid=$!

          cleanup() {
            status=$?
            kill "$api_pid" 2>/dev/null || true
            if [ "$status" -ne 0 ]; then
              echo '=== API LOG ==='
              cat api.log || true
            fi
            exit "$status"
          }
          trap cleanup EXIT

          api_ready=0
          for _ in $(seq 1 30); do
            if [ "$api_ready" -eq 0 ] && curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              api_ready=1
            fi
            if [ "$api_ready" -eq 1 ]; then
              break
            fi
            sleep 1
          done

          test "$api_ready" -eq 1

          export CHATBI_SMOKE_PASSWORD="$ci_admin_password"
          uv run --python 3.11 --locked --no-sync --env-file .env.ci \
            python -m scripts.smoke_web

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit Web dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=low

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.2"

      - name: Install Python
        run: uv python install 3.11

      - name: Verify lockfile
        run: uv lock --check

      - name: Audit Python dependencies
        run: uv run --python 3.11 --locked --with pip-audit pip-audit

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  static-security-scan:
    name: Static security scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.2"

      - name: Install Python
        run: uv python install 3.11

      - name: Run blocking Bandit scan
        run: uv run --python 3.11 --locked --with bandit bandit -r src scripts -ll
