name: Enable PR auto-merge

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: enable-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    name: Enable auto-merge
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_DRAFT: ${{ github.event.pull_request.draft }}
        shell: bash
        run: |
          set -euo pipefail

          auto_merge_enabled=$(gh pr view "$PR_URL" --json autoMergeRequest \
            --jq 'if .autoMergeRequest == null then "false" else "true" end')
          if [ "$auto_merge_enabled" = "true" ]; then
            echo 'Auto-merge is already enabled.'
            exit 0
          fi

          if [[ "$EVENT_DRAFT" != "false" || "$EVENT_BASE_REF" != "master" || "$EVENT_HEAD_REPO" != "$GITHUB_REPOSITORY" ]]; then
            echo 'The event snapshot is not eligible for auto-merge.'
            exit 0
          fi

          live_pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --jq '[.state, (.draft | tostring), .head.sha, .base.ref, (.head.repo.full_name // "")] | @tsv')
          IFS=$'\t' read -r live_state live_draft live_head_sha live_base_ref live_head_repo <<< "$live_pr"

          if [[ "$live_state" != "open" || "$live_draft" != "false" || "$live_base_ref" != "master" || "$live_head_repo" != "$GITHUB_REPOSITORY" ]]; then
            echo 'The live PR is closed, draft, targets another base, or comes from another repository; skipping auto-merge.'
            exit 0
          fi

          if [[ "$live_head_sha" != "$EVENT_HEAD_SHA" || "$live_base_ref" != "$EVENT_BASE_REF" || "$live_head_repo" != "$EVENT_HEAD_REPO" ]]; then
            echo 'The event snapshot is stale; the live PR no longer matches its head or base.'
            exit 0
          fi

          gh pr merge "$PR_URL" --auto --squash
