name: Enable PR auto-merge

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: enable-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    name: Enable auto-merge
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        shell: bash
        run: |
          set -euo pipefail

          auto_merge_enabled=$(gh pr view "$PR_URL" --json autoMergeRequest \
            --jq 'if .autoMergeRequest == null then "false" else "true" end')
          if [ "$auto_merge_enabled" = "true" ]; then
            echo 'Auto-merge is already enabled.'
            exit 0
          fi

          gh pr merge "$PR_URL" --auto --squash
