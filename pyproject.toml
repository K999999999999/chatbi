[project]
name = "chatbi-engine"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate>=1.15,<2",
    "argon2-cffi>=23.1,<26",
    "FlagEmbedding>=1.3,<2",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.115,<1",
    "huggingface-hub>=1,<2",
    "langchain-openai>=1,<2",
    "opentelemetry-api>=1.44,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
    "opentelemetry-sdk>=1.44,<2",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1,<2",
    "qdrant-client>=1.19,<2",
    "sqladmin>=0.20,<1",
    "sqlalchemy>=2,<3",
    "sqlglot>=27,<31",
    "streamlit>=1.40,<2",
    "pydantic>=2,<3",
    "starlette>=0.40,<2",
    "wtforms>=3,<4",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "ruff>=0.14,<1",
]
